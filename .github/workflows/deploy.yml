name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          PROJECT_DIR="/opt/betelgeuse"
          mkdir -p $PROJECT_DIR
          cd $PROJECT_DIR

          # Actualizar código
          if [ ! -d ".git" ]; then
            echo "📦 Clonando repositorio..."
            git clone https://github.com/rhernandezbas/betelgeus_front.git .
          else
            echo "🔄 Actualizando repositorio..."
            git fetch origin
            git reset --hard origin/main
          fi

          # Crear archivo .env si no existe
          if [ ! -f ".env" ]; then
            echo "📝 Creando archivo .env..."
            cp .env.example .env
          fi

          # Detener contenedores existentes
          echo "🛑 Deteniendo contenedores..."
          docker compose down -v 2>&1 || true

          # Limpiar contenedores huérfanos
          docker ps -a | grep betelgeuse-frontend | awk '{print $1}' | xargs -r docker rm -f 2>&1 || true
          docker volume prune -f 2>&1 || true
          docker system prune -af 2>&1

          # Build y deploy
          echo "🏗️  Construyendo nueva imagen..."
          docker compose build --no-cache --pull 2>&1

          if [ $? -ne 0 ]; then
            echo "❌ Error en el build"
            exit 1
          fi

          echo "🚀 Iniciando contenedores..."
          docker compose up -d 2>&1

          if [ $? -ne 0 ]; then
            echo "❌ Error al iniciar contenedores"
            docker compose logs
            exit 1
          fi

          # Verificar
          echo "⏳ Esperando que el servicio esté listo..."
          sleep 20

          echo "📊 Estado de contenedores:"
          docker compose ps -a

          echo "📋 Últimos logs del frontend:"
          docker compose logs --tail=50 frontend

          if ! docker compose ps | grep -q "Up"; then
            echo "❌ Contenedor no está corriendo"
            docker compose logs
            exit 1
          fi

          # Test de conectividad
          echo "🔍 Probando conectividad..."
          if curl -f http://localhost:7842 > /dev/null 2>&1; then
            echo "✅ Frontend responde correctamente en http://190.7.234.37:7842"
          else
            echo "⚠️  Frontend no responde aún (puede necesitar más tiempo)"
          fi

          echo "✅ Despliegue completado exitosamente"
