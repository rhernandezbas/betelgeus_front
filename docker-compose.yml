services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betelgeuse-frontend
    ports:
      - "7842:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    networks:
      - betelgeuse-network
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Descomenta si tienes un backend
  # backend:
  #   image: your-backend-image:latest
  #   container_name: betelgeuse-backend
  #   ports:
  #     - "5605:5605"
  #   environment:
  #     - DATABASE_URL=${DATABASE_URL}
  #   restart: unless-stopped
  #   networks:
  #     - betelgeuse-network

networks:
  betelgeuse-network:
    driver: bridge
  # External network to connect to backend - create if not exists:
  # docker network create backend-network
  backend-network:
    external: true
    name: splynx-tickets_app-network
